name: Publish core package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test --workspace=packages/core
      # setup-node writes an npmrc that authenticates with NODE_AUTH_TOKEN.
      # That classic token is no longer allowed to publish, and while it is
      # set npm will not use the OIDC trusted publisher. Drop it for this step.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/.npmrc"
          npm publish --workspace=packages/core --access public
